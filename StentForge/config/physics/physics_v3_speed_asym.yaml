# speed options are config switches, defaults = the physics_v2 values, and the campaign workstation speed race
# on the expand picks the winners).  Identical to physics_v3 except ONE switch under
# v3.speed (contact_asym_auto: true).  Its results carry this lineage name and are never pooled with
# physics_v3 or another speed child; it inherits result_status PENDING_DECISION.
extends: physics_v3
lineage: physics_v3_speed_asym
description: >
  physics_v3 with ONE speed switch: KEYOPT(8)=2 on the stent-artery CONTA174 (auto asymmetric selection of the
  symmetric pair; CTG 3.5.1 "symmetric contact is less efficient").
  Everything else exactly as physics_v3.
v3:
  speed:
    contact_asym_auto: true                # S4 switch under test (physics_v3: false); CTG 3.5.1
