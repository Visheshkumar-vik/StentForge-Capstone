# speed options are config switches, defaults = the physics_v2 values, and the campaign workstation speed race
# on the expand picks the winners).  Identical to physics_v3 except ONE switch under
# v3.speed (ftoln_artery: 0.2).  Its results carry this lineage name and are never pooled with
# physics_v3 or another speed child; it inherits result_status PENDING_DECISION.
extends: physics_v3
lineage: physics_v3_speed_ftoln
description: >
  physics_v3 with ONE speed switch: FTOLN 0.2 on both stent-artery real sets instead of 0.1 (a looser
  penetration tolerance, fewer bisections from 'too much penetration').
  Everything else exactly as physics_v3.
v3:
  speed:
    ftoln_artery: 0.2                      # S4 switch under test (physics_v3: 0.1); CTG 3.9.2 (FTOLN factor on the underlying element depth)
